# yaml-language-server: $schema=../../challenge.schema.yaml
name: "Denis JS"
author: "Dimas & ayapi"
category: Misc
description: |
  Hello guys, Denis just make a simple calculator in js, can you try it?

value: 1000
type: DynamicContainer

scripts:
  start: cd ./src && docker build -t denis-js .

container:
  flagTemplate: "TCP1P{denis_js_323421bf_[TEAM_HASH]}"
  containerImage: "denis-js:latest"
  memoryLimit: 256
  cpuCount: 1
  storageLimit: 256
  containerExposePort: 6000
  enableTrafficCapture: false

provide: ./dist
